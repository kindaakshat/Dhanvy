services:
  - type: web
    name: trustlayer-api
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm --filter @trustlayer/api run build
    startCommand: pnpm --filter @trustlayer/api run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
